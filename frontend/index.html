<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Sentinel AI</h1>

    <p>Upload a Road Image</p>

    <input type="file" id="imageInput">

    <button id="predictBtn">
        Predict
    </button>

    <h2>Original Image</h2>

    <img id="previewImage">

    <h2>Predicted Image</h2>

    <img id="outputImage">

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
